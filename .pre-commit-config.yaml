# public/ccgarden*.svg are generated, ~700KB+, and single-line -- no fixer,
# linter, or size check should have an opinion about it.
exclude: ^public/ccgarden(-plot)?\.svg$

repos:
  # gitleaks finds credentials. This finds the strings that are only
  # sensitive because of who typed them, from a file outside the tree.
  - repo: https://github.com/dannybrown37/git-a-grip
    rev: v0.15.1
    hooks:
      - id: block-private-terms
      # The script owns the whole file and stages it; regen-file runs it
      # without a shell and re-stages only when the bytes actually moved.
      - id: regen-file
        name: Refresh ccgarden garden
        args:
          - '--command=node scripts/sync-ccgarden.mjs'
          - '--file=public/ccgarden-plot.svg'
      # Widened from the hook's JS default: a .astro component or a post's
      # .md frontmatter breaks these tests as readily as a .ts file. Matched
      # by extension rather than by an `astro` type tag, which older
      # identify releases -- including the one pre-commit is pinned to here
      # -- do not know about.
      # Biome refuses package-lock.json outright and errors when every
      # path it's handed is refused, so a lockfile-only commit fails.
      - id: biome
        exclude: (^|/)package-lock\.json$
      - id: vitest
        types_or: [text]
        files: \.(ts|astro|md)$


  - repo: local
    hooks:
      - id: tsc
        name: tsc
        entry: npx tsc --noEmit
        language: system
        pass_filenames: false
        files: \.(ts|astro)$

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: check-json
      - id: check-yaml
      - id: check-added-large-files

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/woodruffw/zizmor-pre-commit
    rev: v1.30.1
    hooks:
      - id: zizmor
